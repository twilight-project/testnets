version: '3.9'
services:

  kafka:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION:-5.3.1}
    restart: always
    container_name: kafka
    hostname: kafka
    environment:
      - KAFKA_BROKER_ID=0
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,OUTSIDE://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_NUM_PARTITIONS=3
      - CONFLUENT_SUPPORT_METRICS_ENABLE=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    ports:
      - "9092:9092"
    # links: [zookeeper]
    healthcheck:
      test: [ "CMD-SHELL", "cub kafka-ready -b localhost:9092 1 40" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./data/kafka/:/var/lib/kafka/data

  zookeeper:
    hostname: zookeeper
    restart: always
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:${CONFLUENT_VERSION:-5.3.1}
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
    ports:
      - "2181:2181"
    volumes:
      - ./data/zookeeper/:/var/lib/zookeeper
    healthcheck:
      test: [ "CMD", "cub", "zk-ready", "localhost:2181", "30" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  topic-init:
    image: confluentinc/cp-zookeeper:${CONFLUENT_VERSION:-5.3.1}
    depends_on:
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    entrypoint: >
      bash -c '
        echo "Waiting for broker …";
        # cub kafka-ready -b kafka:29092 1 40
        echo "Creating topics …";
        cd /usr/bin;
        for T in "CLIENT-REQUEST" "SnapShotLogTopic" "CoreEventLogTopic" "RelayerStateQueue" "CLIENT-FAILED-REQUEST"; do
          kafka-topics \
            --topic $$T \
            --create --if-not-exists \
            --zookeeper zookeeper:2181 \
            --partitions 1 \
            --replication-factor 1 \
            --config retention.ms=-1 \
            --config cleanup.policy=compact \
            --config message.timestamp.type=LogAppendTime;
        done
        echo "All topics created successfully"
      '
    restart: "no"

  relayer-core:
    build:
      context: ./services/relayer-core
      dockerfile: Dockerfile_relayer_core
    hostname: relayer-core
    restart: on-failure:5
    ports:
      - "3033:3031"
    depends_on:
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    volumes:
      - ./data/relayer-core/relayer_snapshot:/root/relayer_snapshot
      - ./data/relayer-core/state:/home/relayer/state
      - ./data/relayer-core/logs:/home/relayer/logs
      - ./data/relayer-core/event_queue:/root/relayer_snapshot/event_queue
      - ./envs/relayer-core.env:/home/relayer/.env:rw
    container_name: relayer-core

  order-api-service:
    build:
      context: ./services/order-api
      dockerfile: Dockerfile_order_api
    hostname: order-api-service
    stdin_open: true
    restart: always
    ports:
      - "3032:3032"
    depends_on:
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    container_name: order-api-service
    volumes:
      - ./envs/order-api.env:/app/.env

  redis-server:
    image: redis:7.4-alpine
    hostname: redis-server
    container_name: redis-server
    restart: always
    environment:
      - REDIS_PASSWORD=foobared
    command: >
      sh -c 'exec redis-server /usr/local/etc/redis/redis.conf --requirepass $$REDIS_PASSWORD'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - ./services/redis-db/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./data/redis-db/:/data

  data-api-database:
    image: docker.io/bitnami/postgresql:17.5.0
    restart: always
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=relayer
      - POSTGRESQL_PASSWORD=relayer1
      - POSTGRESQL_DATABASE=relayer
      - ALLOW_EMPTY_PASSWORD=NO
    ports:
      - "5435:5432"
    volumes:
      - data-api-database-data:/bitnami/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d relayer -U relayer" ]
      interval: 10s
      timeout: 3s
      retries: 3
    container_name: data-api-database
    hostname: data-api-database

  archiver:
    build:
      context: ./services/data-api
      dockerfile: Dockerfile_data_api
      args:
        BINARY: "archiver"
        DOCKER_BUILDKIT: 0
    hostname: archiver
    restart: on-failure:5
    depends_on:
      data-api-database:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      redis-server:
        condition: service_healthy
    volumes:
      - ./data/data-api-archiver/:/var/log/relayer-archiver
      - ./envs/data-api.env:/app/.env
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth:
    build:
      context: ./services/data-api
      dockerfile: Dockerfile_data_api
      args:
        BINARY: "auth"
        DOCKER_BUILDKIT: 0
    hostname: auth
    restart: on-failure:5
    ports:
      - 5000:5000
    depends_on:
      data-api-database:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      redis-server:
        condition: service_healthy
      archiver:
        condition: service_healthy  
    volumes:
      - ./data/data-api-auth/:/var/log/relayer-auth
      - ./envs/data-api.env:/app/.env
    env_file:
      - ./envs/data-api.env
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s      

  api:
    build:
      context: ./services/data-api
      dockerfile: Dockerfile_data_api
      args:
        BINARY: "api"
        DOCKER_BUILDKIT: 0
    hostname: api
    restart: on-failure:5
    depends_on:
      auth:
        condition: service_started
      redis-server:
        condition: service_healthy
      archiver:
        condition: service_healthy
    ports:
      - 8987:8987
      - 8989:8989
      - 8990:8990
    volumes:
      - ./data/data-api-api/:/var/log/relayer-api
      - ./envs/data-api.env:/app/.env
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-proxy:
    build:
      context: ./proxy/authenticator
    ports:
      - 8088:8088
    restart: always
    depends_on:
      auth:
        condition: service_started
      api:
        condition: service_healthy
      archiver:
        condition: service_healthy
      redis-server:
        condition: service_healthy
    volumes:
      - ./envs/data-api.env:/app/.env

  kafka-sink-database:
    hostname: kafka-sink-database
    container_name: kafka-sink-database
    image: docker.io/bitnami/postgresql:17.5.0
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=my_password
      - POSTGRESQL_DATABASE=my_database
      - ALLOW_EMPTY_PASSWORD=NO
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d my_database -U postgres" ]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - kafka-sink-database-data:/bitnami/postgresql

  kafka-sink:
    hostname: kafka-sink
    container_name: kafka-sink
    build:
      context: ./services/kafka-sink
      dockerfile: Dockerfile_kafka_sink
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      kafka-sink-database:
        condition: service_healthy
    volumes:
      - ./envs/kafka-sink.env:/app/.env

volumes:
  kafka-sink-database-data:
    driver: local
  data-api-database-data:
    driver: local
