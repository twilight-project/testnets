version: '3.1'

services:
  nyks:
    container_name: "nyks"
    build:
      context: ./
      dockerfile: ./nyks/Dockerfile
    ports:
      - "1317:1317"
      - "26656:26656"
      - "26657:26657"
      - "26660:26660"
      - "6969:6969"
      - "9090:9090"
    expose:
      - "1317"
      - "26656"
      - "26657"
      - "26660"
      - "6969"
      - "9090"
    volumes:
      - ./data/.nyks/:/root/.nyks
      - nyks-secrets:/root/secrets/
    command: [ "./nyks_entrypoint.sh" ]
    healthcheck:
      # test: [ "CMD", "curl", "-f", "http://localhost:26657/status" ]
      test: ["CMD-SHELL",
         "curl -sf http://localhost:26657/status >/dev/null && \
          bash -c 'exec 3<>/dev/tcp/localhost/6969'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - network_conn
    restart: always

  zkos_database:
    image: docker.io/bitnami/postgresql:17.5.0
    container_name: zkos_database
    hostname: zkos_database
    restart: always
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=postgres_zkoracle
      - POSTGRESQL_DATABASE=zkoracle_db
      - ALLOW_EMPTY_PASSWORD=NO
    ports:
      - "5433:5432"
    volumes:
      - zkos_database-data:/bitnami/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d zkoracle_db -U postgres" ]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - network_conn

  zkos:
    build:
      context: ./zkos
      dockerfile: Dockerfile
    hostname: zkos
    restart: always
    depends_on:
      zkos_database:
        condition: service_healthy
      nyks:
        condition: service_healthy
    ports:
      - "3030:3030"
      - "2500:2500"
    volumes:
      - ./data/zkos/:/home/zkos/
      - ./zkos/zkos.env:/home/zkos/.env
      - nyks-secrets:/home/zkos/secrets/
    container_name: zkos
    networks:
      - network_conn

  zkpass_database:
    image: docker.io/bitnami/postgresql:latest
    environment:
      - POSTGRESQL_USERNAME=zkpass
      - POSTGRESQL_PASSWORD=zkpass
      - POSTGRESQL_DATABASE=zkpass
    ports:
      - "5436:5432"
    volumes:
      - zkpass-data:/bitnami/postgresql
      - ./zkpass/zkpass.sql:/docker-entrypoint-initdb.d/zkpass.sql:ro
    container_name: zkpass_database
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U zkpass -d zkpass" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - network_conn

  zkpass:
    build:
      context: ./zkpass
      dockerfile: Dockerfile
    hostname: zkpass
    restart: always
    volumes:
      - ./zkpass/.env.twilight-self-backend:/usr/src/app/twilight-self-backend/.env
    ports:
      - "3001:3001"
    depends_on:
      zkpass_database:
        condition: service_healthy
    networks:
      - network_conn
    container_name: zkpass

  # indexer-db:
